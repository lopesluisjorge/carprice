# CarPrice nginx site. Install with:
#     sudo cp deploy/nginx.conf /etc/nginx/sites-available/carprice
#     sudo ln -s /etc/nginx/sites-available/carprice /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
# On distros without sites-available (Arch, Rocky), drop it in
# /etc/nginx/conf.d/carprice.conf instead.
#
# Run certbot AFTER the plain-HTTP block below is serving: it rewrites this file
# in place, adding the certificate lines and the port 80 redirect.
#     sudo certbot --nginx -d carprice.com.br -d www.carprice.com.br

upstream carprice {
    server 127.0.0.1:8000 fail_timeout=0;
}

# A search is a write: it schedules on-demand collection, and collection spends
# a quota of 40 FIPE requests a minute that the whole site shares. The limits in
# crawler/services/scheduling.py bound what one search may enqueue; this bounds
# how many searches one address may make, which is the half nginx can see and
# Django cannot do as cheaply. Only the dynamic side is limited — /static/ has
# its own location below and never reaches this.
#
# 10m of zone holds roughly 160 thousand addresses. Bursting to 20 without delay
# is what keeps the sidebar usable: every filter toggle is its own HTMX request.
limit_req_zone $binary_remote_addr zone=carprice_app:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name carprice.com.br www.carprice.com.br;

    # Nothing here accepts uploads; this only bounds a malicious body.
    client_max_body_size 1m;

    # WhiteNoise would serve these perfectly well — it is what makes the app
    # work before nginx is configured, and on a PaaS. nginx just gets there
    # first, without waking a Python worker.
    location /static/ {
        alias /srv/carprice/staticfiles/;
        access_log off;
        # Safe because collectstatic hashes every name: a changed file is a new
        # URL, so nothing stale can be pinned. The manifest itself is served by
        # Django, not from here.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        limit_req zone=carprice_app burst=20 nodelay;

        proxy_pass http://carprice;
        proxy_http_version 1.1;

        # X-Forwarded-Proto is what SECURE_PROXY_SSL_HEADER trusts, so it has to
        # be set here on every request — never passed through from the client.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;

        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
