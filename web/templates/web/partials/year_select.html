{% load formatting %}
<label class="block text-sm">
  <span class="mb-1.5 block font-medium text-slate-700">Ano</span>
  <select name="{{ field|default:'v' }}" {% if not model_years %}disabled{% endif %} required
          class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 disabled:bg-slate-100 disabled:text-slate-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30">
    <option value="">{% if model_years %}Selecione o ano{% else %}Escolha o modelo{% endif %}</option>
    {% for model_year in model_years %}
      <option value="{{ model_year|code }}">
        {{ model_year|model_year_label }} · {{ model_year.get_fuel_type_display }}
      </option>
    {% endfor %}
  </select>
</label>
