<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CarPrice">
  <style>
    /* One tile in both themes; the dark one only lightens the blue, like the header. */
    .tile { fill: #2563eb; }
    @media (prefers-color-scheme: dark) { .tile { fill: #3b82f6; } }
  </style>
  <rect class="tile" width="64" height="64" rx="14"/>
  <g transform="translate(0,-6)">
    <path fill="#fff" d="M7 46 L7 37.5 C7 35.4 8.5 33.6 10.6 33.2 L19.8 31.4 L26.2 21.6
                         C27.3 20 29.1 19 31 19 L40.6 19 C42.6 19 44.5 19.9 45.8 21.4
                         L54 30.8 C55.9 32 57 34.1 57 36.4 L57 46 Z"/>
    <!-- The arches are the tile showing through: the tire is negative space. -->
    <circle class="tile" cx="20" cy="46" r="7.4"/>
    <circle class="tile" cx="44" cy="46" r="7.4"/>
    <circle fill="#fff" cx="20" cy="46" r="4.8"/>
    <circle fill="#fff" cx="44" cy="46" r="4.8"/>
  </g>
  <!-- The price step the car drives on. -->
  <polyline points="7,56 18,56 27,49.5 57,49.5" fill="none" stroke="#fff" stroke-opacity=".5"
            stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
